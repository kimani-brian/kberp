name: Bug report
description: Something behaves differently from the documented behaviour
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the Security tab's
        private reporting flow described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the observed behaviour and why it is wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the app, screen, record and any values needed.
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. Create ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened, with a reference to the spec if there is one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `make build-id`, or the commit SHA.
      placeholder: "98379da"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local development (make run)
        - Docker Compose
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Firefox 128, Chrome 140"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove credentials, customer data and tokens before pasting.
      render: text
