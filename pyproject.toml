[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kberp"
version = "0.1.0"
description = "KB ERP - Odoo-shaped ERP with five applications"
requires-python = ">=3.12"
dependencies = [
    "werkzeug>=3.0",
    "psycopg[binary,pool]>=3.2",
    "argon2-cffi>=23.1",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "simple-websocket>=1.1",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
kberp = "kberp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kberp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["kberp"]
mypy_path = "src"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
