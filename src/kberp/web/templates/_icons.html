{# App icons: duotone, 1.75px stroke, using the app accent via currentColor. #}
{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == "grid" -%}
    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
    <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
  {%- elif name == "close" -%}
    <path d="M6 6l12 12M18 6L6 18"/>
  {%- elif name == "search" -%}
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
  {%- elif name == "plus" -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == "chevron-left" -%}
    <path d="M15 6l-6 6 6 6"/>
  {%- elif name == "chevron-right" -%}
    <path d="M9 6l6 6-6 6"/>
  {%- elif name == "check" -%}
    <path d="M5 13l4 4L19 7"/>
  {%- endif -%}
</svg>
{%- endmacro %}

{% macro app_icon(key, size=48) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 48 48" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if key == "contacts" -%}
    <rect x="8" y="6" width="32" height="36" rx="4" opacity=".28" fill="currentColor" stroke="none"/>
    <rect x="8" y="6" width="32" height="36" rx="4"/>
    <circle cx="24" cy="19" r="5"/>
    <path d="M15 34c1.6-4 5-6 9-6s7.4 2 9 6"/>
    <path d="M8 12h4M8 20h4M8 28h4"/>
  {%- elif key == "sales" -%}
    <path d="M9 7h20l10 10v24H9z" opacity=".28" fill="currentColor" stroke="none"/>
    <path d="M9 7h20l10 10v24H9z"/>
    <path d="M29 7v10h10"/>
    <path d="M16 28l5 5 11-11"/>
  {%- elif key == "accounting" -%}
    <rect x="7" y="8" width="34" height="32" rx="3" opacity=".28" fill="currentColor" stroke="none"/>
    <rect x="7" y="8" width="34" height="32" rx="3"/>
    <path d="M7 17h34M15 25h8M15 32h5M29 25h5M29 32h5"/>
  {%- elif key == "purchase" -%}
    <path d="M8 12h6l5 20h18l5-14H17" opacity=".28" fill="currentColor" stroke="none"/>
    <path d="M8 12h6l5 20h18l5-14H17"/>
    <circle cx="21" cy="38" r="2.5"/><circle cx="34" cy="38" r="2.5"/>
  {%- elif key == "inventory" -%}
    <path d="M24 6l16 8v20l-16 8-16-8V14z" opacity=".28" fill="currentColor" stroke="none"/>
    <path d="M24 6l16 8v20l-16 8-16-8V14z"/>
    <path d="M8 14l16 8 16-8M24 22v20M16 10l16 8"/>
  {%- elif key == "settings" -%}
    <circle cx="24" cy="24" r="6"/>
    <path d="M24 6v6M24 36v6M6 24h6M36 24h6M11 11l4 4M33 33l4 4M37 11l-4 4M15 33l-4 4"/>
  {%- else -%}
    <rect x="8" y="8" width="32" height="32" rx="6"/>
  {%- endif -%}
</svg>
{%- endmacro %}
