services:
  db:
    image: postgres:16
    container_name: kberp_db
    # WAL archiving bounds point-in-time loss: archive_timeout forces a segment
    # switch at most every minute even on an idle system (NFR-008, RPO <= 15m).
    # Production should point archive_command at durable object storage; the
    # local volume is enough to exercise the drill on a single host.
    entrypoint:
      - sh
      - -c
      - |
        chown postgres:postgres /var/lib/postgresql/wal_archive
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - sh
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - "archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f"
    environment:
      POSTGRES_DB: ${KB_DB_NAME:-kberp}
      POSTGRES_USER: ${KB_DB_USER:-kberp}
      POSTGRES_PASSWORD: ${KB_DB_PASSWORD:-kberp}
    ports:
      - "${KB_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - wal-archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KB_DB_USER:-kberp} -d ${KB_DB_NAME:-kberp}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kberp_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    container_name: kberp_web
    command: ["kberp", "run", "--host", "0.0.0.0", "--port", "8069"]
    environment:
      KB_DB_HOST: db
      KB_DB_PORT: 5432
      KB_DB_USER: ${KB_DB_USER:-kberp}
      KB_DB_PASSWORD: ${KB_DB_PASSWORD:-kberp}
      KB_DB_NAME: ${KB_DB_NAME:-kberp}
      KB_SECRET_KEY: ${KB_SECRET_KEY:-dev-secret}
      KB_ADMIN_PASSWORD: ${KB_ADMIN_PASSWORD:-admin}
      KB_REDIS_URL: redis://redis:6379/0
    ports:
      - "8069:8069"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: kberp_worker
    command: ["kberp", "worker"]
    environment:
      KB_DB_HOST: db
      KB_DB_PORT: 5432
      KB_DB_USER: ${KB_DB_USER:-kberp}
      KB_DB_PASSWORD: ${KB_DB_PASSWORD:-kberp}
      KB_DB_NAME: ${KB_DB_NAME:-kberp}
      KB_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
  wal-archive:

networks:
  default:
    ipam:
      config:
        - subnet: 10.99.7.0/24
